spring.application.name=tranzfa-core-service
spring.profiles.active=local

# Console Logging
logging.pattern.console=${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %cyan([traceId=%X{traceId:-no-trace}]) %yellow(%logger{15}) - %msg%n}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Liquibase Migration Master
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# SpringDoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator

# =======================================================
# FinTech & Core Banking Application Properties
# =======================================================

# SafeHaven MFB BaaS Configuration (Primary Infrastructure)
app.safe-haven.base-url=${SAFEHAVEN_BASE_URL:https://api.sandbox.safehavenmfb.com}
app.safe-haven.client-id=${SAFEHAVEN_CLIENT_ID:sh_test_client_id_2026}
app.safe-haven.client-assertion=${SAFEHAVEN_CLIENT_ASSERTION:sh_test_assertion_placeholder}
app.safe-haven.client-secret=${SAFEHAVEN_CLIENT_SECRET:sh_test_secret_placeholder}
app.safe-haven.account-id=${SAFEHAVEN_ACCOUNT_ID:sh_master_account_001}
app.safe-haven.webhook-secret=${SAFEHAVEN_WEBHOOK_SECRET:whsec_safehaven_test_key_2026}
app.safe-haven.mock-mode=${SAFEHAVEN_MOCK_MODE:true}
app.safe-haven.default-bank-code=${SAFEHAVEN_BANK_CODE:090286}
app.safe-haven.default-bank-name=${SAFEHAVEN_BANK_NAME:Safe Haven Microfinance Bank}

# Security & 3FA Configuration
app.security.max-failed-attempts=${SECURITY_MAX_FAILED_ATTEMPTS:3}
app.security.lock-duration-minutes=${SECURITY_LOCK_DURATION_MINUTES:15}
app.security.pin-history-size=${SECURITY_PIN_HISTORY_SIZE:3}
app.security.password-history-size=${SECURITY_PASSWORD_HISTORY_SIZE:5}

# TOTP & OTP Configuration (Factor 2)
app.totp.digits=${TOTP_DIGITS:6}
app.totp.period-seconds=${TOTP_PERIOD_SECONDS:300}
app.totp.algorithm=${TOTP_ALGORITHM:SHA1}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.mock-mode=${OTP_MOCK_MODE:true}

# JWT Token Configuration
app.jwt.secret=${JWT_SECRET:tranzfa_super_secret_jwt_key_2026_fintech_production_signature_key_min_256_bits!}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
app.jwt.mobile-ttl=${JWT_MOBILE_TTL:432000000}
app.jwt.web-ttl=${JWT_WEB_TTL:86400000}

# Banking Rules & Limits
app.banking.cbn-anti-fraud-threshold-ngn=${CBN_ANTI_FRAUD_THRESHOLD_NGN:500000.0}
app.banking.tier1-daily-limit-ngn=${TIER1_DAILY_LIMIT_NGN:50000.0}
app.banking.tier2-daily-limit-ngn=${TIER2_DAILY_LIMIT_NGN:200000.0}
app.banking.tier3-daily-limit-ngn=${TIER3_DAILY_LIMIT_NGN:10000000.0}
app.banking.interbank-transfer-fee-ngn=${INTERBANK_TRANSFER_FEE_NGN:10.75}

# Async Thread Pool Configuration
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:10}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:50}
app.async.thread-name-prefix=${ASYNC_THREAD_NAME_PREFIX:TranzfaAsync-}
