# =======================================================
# Local Development Profile
# =======================================================

# PostgreSQL Datasource (Local / Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tranzfa_local}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA SQL Logging
spring.jpa.show-sql=true

# Actuator Local Exposure
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger & OpenAPI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# SafeHaven Sandbox / Mock Mode
app.safe-haven.mock-mode=true
app.otp.mock-mode=true
app.passkey.mock-mode=true
