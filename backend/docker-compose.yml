services:

  db:
    image: postgres:17-alpine
    container_name: tranzfa-db
    environment:
      POSTGRES_DB: tranzfa_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tranzfa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tranzfa_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: tranzfa-app
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tranzfa_local
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tranzfa_postgres_data:
